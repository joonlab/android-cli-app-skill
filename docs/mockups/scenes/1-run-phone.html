<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1330,scale=1">
<title>장면 1 · 폰 펼친 화면(가로) — 방금 설치된 장보기 앱</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 폴드8 펼친 화면 가로 1.35:1 — 480 x 355dp 를 3.75배 */
  .screen { zoom: 3.75; width: 480px; height: 355px; border-radius: 0; }
  .status-bar { height: 24px; font-size: 12px; padding: 0 16px; }
  .app-bar { height: 44px; gap: 10px; }
  .app-bar .title { font-size: 20px; }
  .two-pane.list-detail { grid-template-columns: 190px 1fr; }
  .two-pane > .pane { padding: 10px 14px 8px; gap: 8px; }
  .list-row { padding: 8px 10px; }
  .list-row .card-title { font-size: 16px; line-height: 21px; }
  .t-hero { font-size: 20px; line-height: 26px; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 17px; line-height: 22px; }
  .check-row:last-child { border-bottom: 0; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--dim); flex: none; display: flex; align-items: center; justify-content: center; }
  .box.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 14px; }
  .done { color: var(--dim); text-decoration: line-through; }
  .build { margin-top: auto; padding: 8px 10px; }
  .build .b { font-size: 14px; line-height: 19px; font-weight: 600; color: var(--accent); }
  .card.list { padding: 4px 12px; gap: 0; }
  .nav-handle { height: 12px; }
</style></head><body>
<div class="screen app-cyberdeck">
  <div class="status-bar" data-time="2:31"></div>
  <div class="app-bar">
    <span class="mark"><i data-icon="list-checks"></i></span>
    <span class="title">장보기</span>
  </div>
  <div class="two-pane list-detail">
    <div class="pane">
      <div class="list">
        <div class="list-row selected"><div class="grow"><div class="card-title ellipsis">장보기 목록</div></div></div>
        <div class="list-row"><div class="grow"><div class="card-title ellipsis">캠핑 준비물</div></div></div>
      </div>
      <div class="card tint build"><div class="b">빌드 14:30:52</div></div>
    </div>
    <div class="pane">
      <div class="t-hero">장보기 목록</div>
      <div class="card list">
        <div class="check-row"><span class="box on"><i data-icon="check"></i></span><span class="done">우유 2개</span></div>
        <div class="check-row"><span class="box"></span><span>두부, 대파</span></div>
        <div class="check-row"><span class="box"></span><span>사과 1봉지</span></div>
      </div>
    </div>
  </div>
  <div class="nav-handle"></div>
</div>
</body></html>
