org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# 앱 패키지(applicationId = namespace). app/build.gradle.kts 와 dev.sh 가 여기서 읽는다.
appId=APP_PACKAGE
# ⚠️ org.gradle.java.home 은 Gradle «데몬»용이라 gradlew 셸 스크립트 문제(함정 4)를 못 푼다.
#    JAVA_HOME 은 dev.sh 가 찾아서 export 한다. 여기 JDK 경로를 박아 두지 않는다(기기마다 다르다).
