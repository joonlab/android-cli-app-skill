<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1297,h=1800,scale=1">
<title>장면 3 · 폰 커버 화면 — 무선 디버깅 허용</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 폴드8 커버 화면 0.72:1 — 360 x 500dp 를 3.6배 */
  .screen { zoom: 3.6; width: 360px; height: 500px; border-radius: 0; }
  .status-bar { height: 26px; font-size: 13px; padding: 0 18px; }
  .app-bar { height: 50px; gap: 8px; }
  .app-bar .title { font-size: 22px; }
  .screen > .content { padding: 10px 16px; gap: 10px; }
  .card.dense { padding: 12px 14px; }
  .toggle-row { min-height: 0; padding: 4px 0; }
  .label-main { font-size: 18px; line-height: 24px; }
  .caption { font-size: 15px; line-height: 20px; }
  .dialog { position: absolute; left: 14px; right: 14px; bottom: 30px; z-index: 50; background: var(--raised); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .dialog .d-title { font-size: 21px; line-height: 28px; font-weight: 700; }
  .dialog .d-body { font-size: 16px; line-height: 22px; color: var(--dim); }
  .cb { display: flex; align-items: center; gap: 10px; font-size: 17px; line-height: 23px; }
  .cb .box { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .d-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .d-actions .btn { font-size: 18px; height: 44px; padding: 0 20px; }
  .nav-handle { height: 16px; }
</style></head><body>
<div class="screen app-cyberdeck">
  <div class="status-bar" data-time="2:12"></div>
  <div class="app-bar">
    <span class="icon-btn"><i data-icon="arrow-left"></i></span>
    <span class="title">무선 디버깅</span>
  </div>
  <div class="content">
    <div class="card dense" style="gap:0"><div class="toggle-row"><div class="grow"><div class="label-main">사용 중</div></div><span class="switch on"></span></div></div>
    <div class="card dense"><div class="label-main">IP 주소 및 포트</div><div class="caption">사용할 수 없음</div></div>
  </div>
  <div class="scrim"></div>
  <div class="dialog">
    <div class="d-title">이 네트워크에서 무선 디버깅을 허용할까요?</div>
    <div class="d-body">네트워크 이름: 집 Wi-Fi</div>
    <div class="cb"><span class="box"><i data-icon="check"></i></span>이 네트워크에서 항상 허용</div>
    <div class="d-actions"><span class="btn btn-ghost">취소</span><span class="btn btn-primary">허용</span></div>
  </div>
  <div class="nav-handle"></div>
</div>
</body></html>
